[requires]
prova = ">= 0.16"

# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
proofs = ["proofs"]
# Serial: concurrent renders collide on archetect's shared git cache for the composed libraries.
jobs = 1

# CI runs the same suite; capability gating (pnpm) handles what a runner lacks.
[profiles.ci]
jobs = 1
format = "json"

# The org standards suite.
# NOTE (YP6M-3372): pinned to `dev`, the org's integration branch, while the studio staging is
# brought up against the whole archetype fleet — deliberate and temporary, so standards changes
# land here without waiting on a release.
[dependencies]
p6m      = { git = "https://github.com/p6m-archetypes/prova-p6m-standards", tag = "v1" }
